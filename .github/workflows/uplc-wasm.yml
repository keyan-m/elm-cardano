name: UPLC WASM

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WASM native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm jq
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.15.0"
      - name: Build the pinned UPLC WASM fork
        run: ./scripts/build-uplc-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uplc-wasm
          path: cli/pkg-uplc-wasm/
          if-no-files-found: error
